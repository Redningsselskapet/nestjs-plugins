on:
  pull_request:
    branches: [master]
jobs:
  build:
    name: build (node ${{ matrix.node-version }}, nestjs ${{ matrix.nestjs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        # The library supports NestJS 8-11; the oldest and newest are tested.
        nestjs: [8, 11]
    env:
      LIB: '@nestjs-plugins/nestjs-nats-jetstream-transport'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NodeJS ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      # The repo develops against NestJS 11. For the NestJS 8 job, swap the
      # library's NestJS packages for 8.x without touching the lockfile.
      - name: Use NestJS 8 for the library
        if: matrix.nestjs == 8
        run: |
          npm install --no-save -w "$LIB" @nestjs/common@^8 @nestjs/core@^8 @nestjs/microservices@^8
          cd packages/nestjs-nats-jetstream-transport
          node -e "const v=require('@nestjs/microservices/package.json').version; console.log('NestJS', v); if (!v.startsWith('8.')) process.exit(1)"

      # A service container cannot pass the -js flag, so start NATS directly.
      - name: Start NATS JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2.10 -js

      # The demo apps depend on the library's dist output, so build it first.
      # The demos use NestJS 11, so the NestJS 8 job builds the library only.
      - name: Build
        run: |
          npx lerna run build --scope "$LIB"
          if [ "${{ matrix.nestjs }}" = "11" ]; then
            npx lerna run build --ignore "$LIB"
          fi

      - name: Type-check including tests
        run: npx tsc -p packages/nestjs-nats-jetstream-transport/tsconfig.json --noEmit

      - name: Lint
        run: npx lerna run lint:check

      - name: Test
        run: |
          if [ "${{ matrix.nestjs }}" = "11" ]; then
            npx lerna run test
          else
            npx lerna run test --scope "$LIB"
          fi

      - name: Integration test
        run: npx lerna run test:integration
        env:
          NATS_URL: nats://localhost:4222
          NATS_CONTAINER: nats
