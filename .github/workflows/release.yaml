on:
  release:
    types: [created]
jobs:
  build:
    env:
      BUILD_ENV: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_REPOSITORY_ACCESS_TOKEN }}

      - name: Setup NodeJS 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installs the repo's own lerna so npx does not fetch whatever is latest.
      - name: Install
        run: npm ci
      
      - name: Setup Git Config 
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Promote to prod
        run: |
          git checkout master
          npx lerna publish --no-verify-access --conventional-commits --conventional-graduate -m "publish" --no-push --force-git-tag -y
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Push changes rs-marine-services
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.CI_REPOSITORY_ACCESS_TOKEN }}
  